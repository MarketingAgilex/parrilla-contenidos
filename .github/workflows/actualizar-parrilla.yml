name: Actualizar parrilla desde Notion

# Cada ejecución queda vigilando Notion durante casi 6 horas y revisa cada 2 minutos.
# El horario la vuelve a arrancar cada 3 horas, así siempre hay una activa aunque
# GitHub retrase las tareas programadas.
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:        # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]
    paths: [".github/workflows/actualizar-parrilla.yml", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: actualizar-parrilla
  cancel-in-progress: true   # la ejecución nueva reemplaza a la anterior

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vigilar la parrilla en Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          fin=$(( $(date +%s) + 345*60 ))
          while [ "$(date +%s)" -lt "$fin" ]; do
            if python scripts/actualizar_notion.py; then
              git add data.json
              if ! git diff --cached --quiet; then
                git commit -q -m "Actualiza parrilla desde Notion"
                git pull -q --rebase origin main && git push -q origin HEAD:main || echo "No se pudo subir; se reintenta en la siguiente vuelta"
              fi
            else
              echo "Lectura falló; se reintenta en 2 minutos"
            fi
            sleep 120
          done
